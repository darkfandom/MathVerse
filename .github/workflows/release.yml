name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Get Version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish Desktop
      run: |
        dotnet publish src/Desktop/MathVerse.Desktop.csproj --configuration Release --output ./publish/desktop-windows --runtime win-x64 --self-contained
        dotnet publish src/Desktop/MathVerse.Desktop.csproj --configuration Release --output ./publish/desktop-linux --runtime linux-x64 --self-contained
        dotnet publish src/Desktop/MathVerse.Desktop.csproj --configuration Release --output ./publish/desktop-macos --runtime osx-x64 --self-contained

    - name: Publish Web
      run: |
        dotnet publish src/Web/MathVerse.Web.csproj --configuration Release --output ./publish/web

    - name: Pack NuGet
      run: |
        dotnet pack src/Kernel/MathVerse.Kernel.csproj --configuration Release --output ./nupkgs
        dotnet pack src/Math/Core/MathVerse.Math.Core.csproj --configuration Release --output ./nupkgs

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/desktop-windows/*
          ./publish/desktop-linux/*
          ./publish/desktop-macos/*
          ./publish/web/*
          ./nupkgs/*
        generate_release_notes: true
